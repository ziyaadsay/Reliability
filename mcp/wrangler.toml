name = "relstrat-mcp"

# Dev Keys mode: the loader validates the bearer key before the worker runs,
# so the paths must cover the MCP endpoint or every call 401s.
[[gizmos_api_keys]]
name = "MCP"
description = "MCP client access to the Reliability Strategy dashboard data (Streamable HTTP transport)"
paths = ["/mcp", "/mcp/*"]

# App-to-app door. Other gizmos call the exported Reliability class over RPC (see
# BINDING.md). The binding is published to the whole TELUS org by the deploy workflow,
# so any gizmo in the org can declare and call it. To restrict it again, add
#   [vars]
#   BINDING_CALLERS = "<app id>,<app id>"
# and the worker refuses every other caller with "caller not permitted".
[[gizmos_binding]]
entrypoint = "Reliability"
doc = "BINDING.md"
