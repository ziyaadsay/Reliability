# Builds the dashboard and deploys it to Gizmos (relstrat.telus.gizmos.run).
#
# Runs on every push to main that touches the site, and on demand from the
# Actions tab ("Run workflow", any branch). Needs one repository secret:
#   GIZMOS_API_KEY  - a gzm_ key generated at https://gizmos.run/settings
name: Deploy to Gizmos

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy-gizmos.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish (go live) or only save a version"
        type: choice
        options: [publish, save]
        default: publish
      app:
        description: "Gizmos app to deploy to (use relstrat-dev for a test copy)"
        type: string
        default: relstrat
      hosting:
        description: "static = the plain dashboard; worker = dashboard served by a worker with the Ask-the-data AI endpoint"
        type: choice
        options: [static, worker]
        default: static

concurrency:
  group: deploy-gizmos
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GIZMOS_URL: https://gizmos.run
      GIZMOS_APP: ${{ inputs.app || 'relstrat' }}
      GIZMOS_ORG: telus
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      - name: Install gizmos CLI
        run: |
          curl -fsSL https://gizmos.run/skills/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The CLI lists files with `git ls-files --exclude-standard`, so a gitignored
      # dist/ inside the checkout yields "No files found". Push from a copy that
      # lives outside the repository instead.
      - name: Stage build output outside the repository
        env:
          HOSTING: ${{ inputs.hosting || 'static' }}
        run: |
          rm -rf "$RUNNER_TEMP/deploy"
          if [ "$HOSTING" = "worker" ]; then
            node site/worker/build.mjs site/dist "$RUNNER_TEMP/deploy"
          else
            cp -r site/dist "$RUNNER_TEMP/deploy"
          fi
          echo "DEPLOY_DIR=$RUNNER_TEMP/deploy" >> "$GITHUB_ENV"

      - name: Preview upload
        run: gizmos push --dry-run --app "$GIZMOS_APP" --org "$GIZMOS_ORG" "$DEPLOY_DIR"

      - name: Deploy (go live)
        if: github.event_name == 'push' || inputs.publish == 'publish'
        env:
          GIZMOS_API_KEY: ${{ secrets.GIZMOS_API_KEY }}
        run: gizmos push --app "$GIZMOS_APP" --org "$GIZMOS_ORG" -m "${GITHUB_REF_NAME} ${GITHUB_SHA::7}" "$DEPLOY_DIR"

      - name: Save version only (not live)
        if: github.event_name == 'workflow_dispatch' && inputs.publish == 'save'
        env:
          GIZMOS_API_KEY: ${{ secrets.GIZMOS_API_KEY }}
        run: gizmos save --app "$GIZMOS_APP" --org "$GIZMOS_ORG" -m "${GITHUB_REF_NAME} ${GITHUB_SHA::7}" "$DEPLOY_DIR"
