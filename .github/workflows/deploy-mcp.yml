# Builds the Relstrat MCP server (mcp/) and deploys it to Gizmos as the
# relstrat-mcp app (app_type=mcp). Runs on pushes to main that touch the MCP
# worker or the dashboard data it is built from, and on demand from the Actions
# tab. Uses the same GIZMOS_API_KEY repository secret as deploy-gizmos.yml.
name: Deploy MCP server to Gizmos

on:
  push:
    branches: [main]
    paths: ["mcp/**", "site/App.jsx", ".github/workflows/deploy-mcp.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-mcp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GIZMOS_URL: https://gizmos.run
      GIZMOS_APP: relstrat-mcp
      GIZMOS_ORG: telus
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build MCP worker
        run: node mcp/build.mjs

      # The stock CLI hardcodes auth_mode dev_keys on every `push --mcp`, and the hub has
      # no auth-mode setting. The patched copy reads GIZMOS_AUTH_MODE instead, so the
      # server deploys in user_auth mode (browser SSO, no API key). Every push must use
      # it: a stock-CLI push flips the app back to key mode and the connector loads no tools.
      - name: Fetch and patch the gizmos CLI for user_auth
        run: |
          curl -fsSL https://gizmos.run/skills/gizmos.mjs -o "$RUNNER_TEMP/gizmos-stock.mjs"
          node mcp/patch-cli.mjs "$RUNNER_TEMP/gizmos-stock.mjs" "$RUNNER_TEMP/gizmos-userauth.mjs"
          echo "GIZMOS_CLI=$RUNNER_TEMP/gizmos-userauth.mjs" >> "$GITHUB_ENV"

      # The CLI lists files with `git ls-files`, so the gitignored mcp/dist must
      # be pushed from a copy outside the repository.
      - name: Stage build output outside the repository
        run: |
          rm -rf "$RUNNER_TEMP/mcp-deploy"
          cp -r mcp/dist "$RUNNER_TEMP/mcp-deploy"
          echo "DEPLOY_DIR=$RUNNER_TEMP/mcp-deploy" >> "$GITHUB_ENV"

      # Pushes the app root (the folder holding wrangler.toml), not src/, so the platform
      # keeps the declared bindings.
      - name: Preview upload
        run: node "$GIZMOS_CLI" push --dry-run --mcp --app "$GIZMOS_APP" --org "$GIZMOS_ORG" "$DEPLOY_DIR"

      - name: Deploy (user_auth)
        env:
          GIZMOS_API_KEY: ${{ secrets.GIZMOS_API_KEY }}
          GIZMOS_AUTH_MODE: user_auth
        run: node "$GIZMOS_CLI" push --mcp --app "$GIZMOS_APP" --org "$GIZMOS_ORG" -m "${GITHUB_REF_NAME} ${GITHUB_SHA::7}" "$DEPLOY_DIR"

      # Proof: in user_auth mode the protected-resource document names the org's
      # authorization server. In dev_keys mode this URL answers 401 invalid_token.
      - name: Verify user_auth is live
        run: |
          URL="https://${GIZMOS_APP}.${GIZMOS_ORG}.gizmos.run/.well-known/oauth-protected-resource"
          for i in 1 2 3 4 5 6; do
            BODY=$(curl -fsS "$URL" 2>/dev/null) && break
            echo "attempt $i: not ready yet"; sleep 10
          done
          echo "$BODY"
          echo "$BODY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const ok=Array.isArray(j.authorization_servers)&&j.authorization_servers.some(a=>a.includes("/orgs/'"$GIZMOS_ORG"'/auth"));if(!ok){console.error("authorization_servers does not name the org auth server");process.exit(1)}console.log("user_auth confirmed:",j.authorization_servers.join(", "))})'

      # App-to-app door: the worker also exports `class Reliability extends WorkerEntrypoint`
      # ([[gizmos_binding]] in wrangler.toml, documented in BINDING.md). Publishing is
      # idempotent and lets every gizmo in the org call it without a per-app share.
      - name: Publish the Reliability binding to the org
        env:
          GIZMOS_API_KEY: ${{ secrets.GIZMOS_API_KEY }}
        run: node "$GIZMOS_CLI" binding publish "$GIZMOS_APP" --entrypoint Reliability --org "$GIZMOS_ORG"

      - name: List bindings and shares
        env:
          GIZMOS_API_KEY: ${{ secrets.GIZMOS_API_KEY }}
        run: |
          echo "== gizmos binding list =="
          node "$GIZMOS_CLI" binding list --org "$GIZMOS_ORG"
          echo
          echo "== gizmos binding shares $GIZMOS_APP =="
          node "$GIZMOS_CLI" binding shares "$GIZMOS_APP" --org "$GIZMOS_ORG"
